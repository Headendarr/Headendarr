version: "3"

vars:
  COMPOSE_FILE: ./docker/docker-compose.dev-aio.yml
  MIGRATION_COMPOSE_FILE: ./docker/docker-compose.dev-migrate.yml

tasks:
  init:
    desc: Initialize local cache directories
    cmds:
      - mkdir -p temp/cache/.npm-frontend temp/cache/.npm-frontend-global temp/cache/.npm-docs temp/cache/.npm-docs-global temp/cache/uv

  dev:
    desc: Run a dev env
    cmds:
      - task: frontend:stop
      - task: frontend:start
      - task: backend:build
      - task: backend:start
      - docker compose -f {{.COMPOSE_FILE}} logs -fn10 headendarr frontend

  all:start:
    desc: Start backend, frontend, and docs services in dev AIO stack (detached)
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d headendarr frontend docs

  all:stop:
    desc: Stop backend, frontend, and docs services in dev AIO stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  backend:start:
    desc: Start backend (tic) service in dev AIO stack (detached)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d headendarr

  backend:stop:
    desc: Stop backend (tic) service in dev AIO stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop headendarr

  backend:logs:
    desc: Tail backend (tic) service logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs {{.CLI_ARGS}} headendarr

  backend:build:
    desc: Build backend (tic) service image
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build headendarr

  docker:build:staging:
    desc: Build the local josh5/headendarr:staging image with release metadata
    cmds:
      - |
        bash -c '
        set -eu

        image="josh5/headendarr:staging"
        base_image="ghcr.io/tvheadend/tvheadend:edge-debian"
        git_sha="$(git rev-parse HEAD)"
        sha_short="$(git rev-parse --short=7 HEAD)"
        branch_name="$(git branch --show-current)"
        build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        version_file="./docker/overlay/version.txt"
        version_file_backup="$(mktemp)"

        if [ -z "$branch_name" ]; then
          branch_name="detached"
        fi

        cp "$version_file" "$version_file_backup"
        restore_version_file() {
          if [ -f "$version_file_backup" ]; then
            cp "$version_file_backup" "$version_file"
            rm -f "$version_file_backup"
          fi
        }
        trap restore_version_file EXIT INT TERM

        echo "Build: [$(date +"%F %T")] [$branch_name] [$git_sha]" > "$version_file"

        build_status=0
        docker build \
          --file docker/Dockerfile \
          --tag "$image" \
          --build-arg "VERSION=$git_sha" \
          --build-arg "BUILD_DATE=$build_date" \
          --build-arg "BASE_IMAGE=$base_image" \
          --label "maintainer=Josh.5" \
          --label "source.version=$sha_short" \
          --label "source.project=Headendarr" \
          --label "source.service=headendarr" \
          --label "org.opencontainers.image.title=headendarr" \
          --label "org.opencontainers.image.description=A tool for simplifying IPTV configuration in TVHeadend" \
          --label "org.opencontainers.image.created=$build_date" \
          --label "org.opencontainers.image.revision=$git_sha" \
          --label "org.opencontainers.image.version=staging" \
          --label "org.opencontainers.image.source=https://github.com/Headendarr/Headendarr" \
          --label "org.opencontainers.image.url=https://github.com/Headendarr/Headendarr" \
          --label "org.opencontainers.image.licenses=Apache-2.0" \
          . || build_status=$?

        restore_version_file
        trap - EXIT INT TERM
        exit "$build_status"
        '

  backend:_quality:
    internal: true
    deps: [init]
    requires:
      vars: [RUFF_ACTION]
    cmds:
      - |
        docker compose -f {{.COMPOSE_FILE}} run --rm --no-deps --entrypoint="" --user 1000:1000 \
          -v ./temp/cache/uv:/tmp/uv-cache -w /app headendarr \
          bash -c '
            set -e
            export UV_CACHE_DIR=/tmp/uv-cache
            export UV_PROJECT_ENVIRONMENT=/app/.venv
            export RUFF_CACHE_DIR=/tmp/uv-cache/ruff
            uv sync --frozen --python 3.13

            action="$1"
            shift
            if [ "$#" -eq 0 ]; then
              set -- .
            fi
            case "$action" in
              lint)
                uv run --frozen ruff check "$@"
                ;;
              format-check)
                uv run --frozen ruff format --check "$@"
                ;;
              check)
                status=0
                uv run --frozen ruff format --check "$@" || status=1
                uv run --frozen ruff check "$@" || status=1
                exit "$status"
                ;;
              *)
                echo "Unknown backend quality action: $action" >&2
                exit 2
                ;;
            esac
          ' -- "{{.RUFF_ACTION}}" {{.QUALITY_ARGS}}

  backend:lint:
    desc: "Run Ruff lint checks. Defaults to all files; pass paths after -- to limit the check."
    cmds:
      - task: backend:_quality
        vars:
          RUFF_ACTION: lint
          QUALITY_ARGS: "{{.CLI_ARGS}}"

  backend:format:check:
    desc: "Check Ruff formatting. Defaults to all files; pass paths after -- to limit the check."
    cmds:
      - task: backend:_quality
        vars:
          RUFF_ACTION: format-check
          QUALITY_ARGS: "{{.CLI_ARGS}}"

  backend:check:
    desc: "Run Ruff format and lint checks. Defaults to all files; pass paths after -- to limit the check."
    cmds:
      - task: backend:_quality
        vars:
          RUFF_ACTION: check
          QUALITY_ARGS: "{{.CLI_ARGS}}"

  backend:sync:
    desc: Sync the Python 3.13 development environment from uv.lock
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm --no-deps --entrypoint="" --user 1000:1000 -v ./temp/cache/uv:/tmp/uv-cache -w /app -e UV_CACHE_DIR=/tmp/uv-cache -e UV_PROJECT_ENVIRONMENT=/app/.venv headendarr uv sync --frozen --python 3.13

  backend:audit:
    desc: Audit locked Python dependencies for known vulnerabilities
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm --no-deps --entrypoint="" --user 1000:1000 -v ./temp/cache/uv:/tmp/uv-cache -w /app -e UV_CACHE_DIR=/tmp/uv-cache headendarr uv audit --frozen --python-version 3.13

  backend:upgrade:
    desc: Upgrade, sync, and audit backend Python dependencies with uv
    deps: [init]
    cmds:
      - |
        docker compose -f {{.COMPOSE_FILE}} run --rm --no-deps --entrypoint="" --user 1000:1000 \
          -v ./temp/cache/uv:/tmp/uv-cache -w /app headendarr \
          bash -c '
            set -e
            export UV_CACHE_DIR=/tmp/uv-cache
            export UV_PROJECT_ENVIRONMENT=/app/.venv
            uv lock --upgrade --python 3.13
            uv sync --frozen --python 3.13
            uv audit --frozen --python-version 3.13
          '

  backend:migrate:rollback-last:
    desc: Roll back the most recent Alembic migration using a one-off backend (tic) container
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm -e SKIP_MIGRATIONS=true -e ROLLBACK_LAST_MIGRATION=true headendarr

  backend:migrate:current:
    desc: Print the current Alembic migration revision using a one-off backend (tic) container
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm -e SKIP_MIGRATIONS=true -e PRINT_CURRENT_MIGRATION=true headendarr

  backend:migrate:create:
    desc: "Create a new Alembic migration from a clean disposable backend (tic) container. Usage: task backend:migrate:create -- add_descriptive_message"
    cmds:
      - |
        migration_message="{{.CLI_ARGS}}"
        if [ -z "$migration_message" ]; then
          echo "Error: migration message is required."
          echo "Usage: task backend:migrate:create -- add_descriptive_message"
          exit 1
        fi
        docker compose -f {{.MIGRATION_COMPOSE_FILE}} down -v --remove-orphans >/dev/null 2>&1 || true
        docker compose -f {{.MIGRATION_COMPOSE_FILE}} up -d headendarr-migrate

        ready=0
        for _ in $(seq 1 60); do
          if docker compose -f {{.MIGRATION_COMPOSE_FILE}} exec -T -w /app headendarr-migrate /var/venv-docker/bin/python -m alembic current >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$ready" -ne 1 ]; then
          echo "Error: disposable migration container did not become ready in time."
          docker compose -f {{.MIGRATION_COMPOSE_FILE}} logs --tail=120 headendarr-migrate || true
          exit 1
        fi

        docker compose -f {{.MIGRATION_COMPOSE_FILE}} exec -T -w /app headendarr-migrate /var/venv-docker/bin/python -m alembic revision --autogenerate -m "$migration_message"
        docker compose -f {{.MIGRATION_COMPOSE_FILE}} down -v --remove-orphans >/dev/null 2>&1 || true

  backend:shell:
    desc: Start backend (tic) service in dev AIO stack (detached)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec headendarr bash

  frontend:start:
    desc: Start frontend dev server service in dev AIO stack (detached)
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d frontend

  frontend:stop:
    desc: Stop frontend dev server service in dev AIO stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop frontend

  frontend:logs:
    desc: Tail frontend dev server logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs {{.CLI_ARGS}} frontend

  frontend:clean:
    desc: Clear Quasar CLI caches for frontend
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm frontend bash -lc "npm install"
      - docker compose -f {{.COMPOSE_FILE}} run --rm frontend bash -lc "npx quasar clean"

  frontend:build:
    desc: Build frontend (Quasar SPA) for backend serving
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm frontend bash -lc "npx quasar build"

  frontend:upgrade:
    desc: Upgrade Quasar and npm dependencies
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm frontend bash -c "npm audit || true"
      - docker compose -f {{.COMPOSE_FILE}} run --rm frontend bash -c "npm install -g @quasar/cli && /home/node/.npm-global/bin/quasar upgrade -i && npm update && npm audit fix"

  docs:start:
    desc: Start docs dev server service in dev AIO stack (detached)
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d docs

  docs:stop:
    desc: Stop docs dev server service in dev AIO stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop docs
      - docker compose -f {{.COMPOSE_FILE}} stop docs-static

  docs:logs:
    desc: Tail docs dev server logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs {{.CLI_ARGS}} docs

  docs:build:
    desc: Build static documentation pages
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm docs bash -lc "npm run build"

  docs:upgrade:
    desc: Upgrade Docusaurus and npm dependencies
    deps: [init]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm docs bash -c "npm i @docusaurus/core@latest @docusaurus/preset-classic@latest @docusaurus/module-type-aliases@latest @docusaurus/types@latest @docusaurus/faster@latest && npm update && npm audit fix"

  docs:static:start:
    desc: Start docs static server service in dev AIO stack (detached)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d docs-static

  docs:static:stop:
    desc: Stop docs static server service in dev AIO stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop docs-static

  docs:static:logs:
    desc: Tail docs static server logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs {{.CLI_ARGS}} docs-static

  bump-version:
    desc: Bump frontend version (default patch, or pass major/minor/patch)
    cmds:
      - |
        bump_type="{{.CLI_ARGS}}"
        if [ -z "$bump_type" ]; then
          bump_type="patch"
        fi
        case "$bump_type" in
          patch|minor|major) ;;
          *)
            echo "Error: Invalid bump type '$bump_type'. Use: patch, minor, or major."
            echo "Usage: task bump-version [-- patch|minor|major]"
            exit 1
            ;;
        esac

        npm --prefix frontend version "$bump_type" --no-git-tag-version
        new_version=$(node -p "require('./frontend/package.json').version")
        uv version "$new_version" --no-sync
        git add frontend/package.json frontend/package-lock.json pyproject.toml uv.lock
        echo "Version bumped with '$bump_type' in frontend/package.json, package-lock.json, and pyproject.toml"
        echo "Staged: frontend/package.json frontend/package-lock.json pyproject.toml uv.lock"
        echo "Next run:"
        echo "> git commit -m 'Bump version $new_version'"
